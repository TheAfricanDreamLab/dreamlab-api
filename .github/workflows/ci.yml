name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs ask for more only where they need it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm run license-check

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e

  # Builds every image; on main also publishes ghcr.io/<org>/dreamlab-<app>:sha-<short> and :main.
  docker:
    runs-on: ubuntu-latest
    # Publish only images that passed the end-to-end tests.
    needs: [check, e2e]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [gateway, iam]
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/dreamlab-${{ matrix.app }}"
          echo "tags=${image}:sha-${GITHUB_SHA::7},${image}:main" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.PUBLISH == 'true' && steps.names.outputs.tags || format('dreamlab-{0}:ci', matrix.app) }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Ask dreamlab-infra to roll the new images out to staging (needs an INFRA_DISPATCH_TOKEN secret:
  # a fine-grained token with Contents: read & write on dreamlab-infra). Skipped when absent.
  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The dispatch uses INFRA_DISPATCH_TOKEN; this job needs no GITHUB_TOKEN rights.
    permissions: {}
    steps:
      - env:
          TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "No INFRA_DISPATCH_TOKEN; deploy from dreamlab-infra by hand."; exit 0; }
          payload=$(jq -nc --arg tag "sha-${GITHUB_SHA::7}" '{event_type: "deploy", client_payload: {services: "init-db,iam,gateway", tag: $tag}}')
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository_owner }}/dreamlab-infra/dispatches" -d "$payload"
